name: Flutter SDK Update Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PINNED_FILES: >-
    .github/workflows/flutter.yml
    .github/workflows/release.yml
    .github/workflows/integration_tests.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Determine current and latest Flutter stable
        id: versions
        run: |
          current=$(grep -m1 "flutter-version:" .github/workflows/flutter.yml \
            | sed -E "s/.*'([0-9.]+)'.*/\1/")
          latest=$(curl -sSf \
            https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); h=d['current_release']['stable']; r=next(x for x in d['releases'] if x['hash']==h); print(r['version'])")
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
          if [ "$current" != "$latest" ] && [ "$newest" = "$latest" ]; then
            changed=true
          else
            changed=false
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Current pin: $current | Latest stable: $latest | update: $changed"

      - name: Require GH_PAT for workflow file bumps
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Repository secret GH_PAT is not set."
            echo "::error::This workflow edits .github/workflows/*; GitHub rejects those pushes from GITHUB_TOKEN."
            echo "::error::Create a PAT with repo + workflow scopes and add it as GH_PAT."
            exit 1
          fi

      - name: Bump pinned Flutter version in all workflows
        if: steps.versions.outputs.changed == 'true'
        run: |
          for f in $PINNED_FILES; do
            sed -i -E "s/(flutter-version: ')[0-9.]+(')/\1${{ steps.versions.outputs.latest }}\2/" "$f"
          done
          if grep -rn "flutter-version: '${{ steps.versions.outputs.current }}'" $PINNED_FILES; then
            echo "::error::A workflow still pins the old Flutter version" && exit 1
          fi

      - name: Open pull request
        if: steps.versions.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          branch: chore/flutter-sdk-${{ steps.versions.outputs.latest }}
          delete-branch: true
          commit-message: "chore: bump Flutter SDK to ${{ steps.versions.outputs.latest }}"
          title: "chore: bump Flutter SDK ${{ steps.versions.outputs.current }} → ${{ steps.versions.outputs.latest }}"
          labels: dependencies
          body: |
            Automated bump of the pinned Flutter **stable** SDK.

            | | Version |
            |---|---|
            | Was | `${{ steps.versions.outputs.current }}` |
            | Now | `${{ steps.versions.outputs.latest }}` |

            Generated by `.github/workflows/flutter-sdk-update.yml`.
